# Build iOS assinado e envio ao TestFlight.
#
# SECRETS (GitHub: Settings > Secrets and variables > Actions > New repository secret)
#
#  IOS_CERTIFICATE_BASE64        Certificado "Apple Distribution" (.p12) em base64.
#       Keychain Access > Meus Certificados > clique com o direito no certificado
#       "Apple Distribution: ..." > Exportar > formato .p12 > defina uma senha.
#       Converta:  base64 -i certificado.p12 | pbcopy        (Mac)
#                  [Convert]::ToBase64String([IO.File]::ReadAllBytes("certificado.p12")) | Set-Clipboard   (Windows)
#  IOS_CERTIFICATE_PASSWORD      A senha definida ao exportar o .p12.
#  IOS_PROVISION_PROFILE_BASE64  Perfil "App Store" (.mobileprovision) em base64.
#       developer.apple.com > Certificates, IDs & Profiles > Profiles > "+" > App Store Connect
#       > App ID br.com.lumno.targetautospa > escolha o certificado Distribution
#       > nome "Target Auto Spa App Store" > baixe e converta para base64 como acima.
#  APP_STORE_CONNECT_KEY_ID      Key ID da API Key (ex.: 38FKF4N94J).
#  APP_STORE_CONNECT_ISSUER_ID   Issuer ID (UUID).
#  APP_STORE_CONNECT_KEY_BASE64  Arquivo AuthKey_<KEYID>.p8 em base64.
#       appstoreconnect.apple.com > Users and Access > Integrations > App Store Connect API
#       > Team Keys. O Issuer ID aparece no topo; o .p8 só pode ser baixado UMA vez.
#       Papel recomendado da chave: App Manager.
#
# Team ID (KH97Q8M556) já está em src-tauri/tauri.conf.json.

name: iOS Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

# Permissões mínimas do GITHUB_TOKEN: o job só lê o código
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Rust e targets iOS
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: |
          npm ci
          brew install xcodegen

      - name: Rodar testes
        run: npm test

      - name: Definir número do build
        run: |
          # +100 garante ficar acima de qualquer build já enviado (inclusive os do Codemagic)
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          echo "github.run_number=$GITHUB_RUN_NUMBER run_attempt=$GITHUB_RUN_ATTEMPT -> bundleVersion=$BUILD_NUMBER"
          BUILD_NUMBER="$BUILD_NUMBER" node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.iOS=c.bundle.iOS||{};c.bundle.iOS.bundleVersion=process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          echo "tauri.conf.json bundle.iOS:"
          node -e "console.log(JSON.stringify(require('./src-tauri/tauri.conf.json').bundle.iOS))"

      - name: Gerar projeto iOS
        run: npm run tauri ios init -- --ci

      # O Tauri gera o projeto Xcode com assinatura automática. Aqui instalamos o certificado e o
      # perfil e depois forçamos assinatura manual no projeto (o que o Codemagic fazia com
      # `xcode-project use-profiles`).
      # O Tauri não tem opção de configuração para entitlements e gen/ não é versionado:
      # a capacidade "Sign in with Apple" é inserida no arquivo gerado a cada build.
      # Exige o perfil App Store gerado DEPOIS de habilitar a capacidade no App ID.
      - name: Habilitar Sign in with Apple (entitlement)
        run: |
          ENT="$(find src-tauri/gen/apple -name '*.entitlements' -not -path '*/build/*' | head -1)"
          if [ -z "$ENT" ]; then
            echo "::error::Nenhum arquivo .entitlements no projeto iOS gerado."
            find src-tauri/gen/apple -maxdepth 2 -not -path '*/build/*' | head -40
            exit 1
          fi
          echo "Entitlements: $ENT"
          echo "== antes"; cat "$ENT"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENT"
          echo "== depois"; cat "$ENT"
          grep -n "entitlements\|CODE_SIGN_ENTITLEMENTS" src-tauri/gen/apple/project.yml || echo "(project.yml não cita entitlements)"

      - name: Conferir versão no projeto gerado
        run: |
          grep -rn -A1 "CFBundleVersion\|CFBundleShortVersionString" src-tauri/gen/apple --include=Info.plist --include=project.yml || true

      - name: Instalar e verificar ícones do iOS
        run: |
          APPICON_DIR="src-tauri/gen/apple"
          SET="$APPICON_DIR/Assets.xcassets/AppIcon.appiconset"

          echo "== project.yml: nome do ícone e catálogos"
          grep -rn "APPICON\|appicon\|Assets.xcassets" "$APPICON_DIR"/project.yml || true
          echo "== Todos os .xcassets e .appiconset"
          find "$APPICON_DIR" \( -name '*.xcassets' -o -name '*.appiconset' \) -not -path '*/build/*'
          echo "== PNGs soltos fora de catálogos (podem competir com o AppIcon)"
          find "$APPICON_DIR" -name '*.png' -not -path '*.xcassets/*' -not -path '*/build/*' || true
          echo "== Info.plist: chaves de ícone"
          grep -rn -A3 "CFBundleIcon" "$APPICON_DIR" --include=Info.plist || true

          if [ ! -d "$SET" ]; then
            echo "::error::$SET não existe. O tauri ios init não gerou o AppIcon."
            exit 1
          fi

          # O template do Tauri já traz ícones padrão (não vazios). Sobrescreve sempre com os nossos.
          echo "== Hash dos ícones do template ANTES de sobrescrever"
          (cd "$SET" && shasum AppIcon-512@2x.png 2>/dev/null || true)
          cp -f src-tauri/icons/ios/*.png "$SET"/

          echo "== Conferência: hash origem x catálogo (devem ser iguais)"
          FALHOU=0
          for f in src-tauri/icons/ios/*.png; do
            n="$(basename "$f")"
            a="$(shasum "$f" | awk '{print $1}')"
            b="$(shasum "$SET/$n" | awk '{print $1}')"
            if [ "$a" != "$b" ]; then echo "DIFERENTE: $n"; FALHOU=1; fi
          done
          [ "$FALHOU" = "0" ] || { echo "::error::Ícones do catálogo diferem de src-tauri/icons/ios"; exit 1; }

          ENCONTROU=0
          for f in "$SET"/*.png; do
            L="$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')"
            A="$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')"
            if [ "$L" = "1024" ] && [ "$A" = "1024" ]; then ENCONTROU=1; fi
          done
          [ "$ENCONTROU" = "1" ] || { echo "::error::Nenhum PNG 1024x1024 em $SET."; exit 1; }

      - name: Instalar certificado e perfil
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/perfil.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/perfil.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Perfil instalado: $PROFILE_NAME ($PROFILE_UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configurar assinatura manual no projeto Xcode
        run: |
          pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools
          cd src-tauri/gen/apple
          xcode-project use-profiles

      - name: Build do app iOS
        run: |
          # O Tauri compila e cria o archive. A exportação dele pode falhar; seguimos se o archive existir
          npm run tauri ios build -- --export-method app-store-connect || true
          ARCHIVE="$(find src-tauri/gen/apple -name '*.xcarchive' | head -1)"
          echo "Archive encontrado: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then echo "Nenhum archive foi gerado"; exit 1; fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Exportar .ipa
        run: |
          if find src-tauri/gen/apple -name '*.ipa' | grep -q .; then
            echo ".ipa já exportado pelo Tauri"
            exit 0
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>KH97Q8M556</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.lumno.targetautospa</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive             -archivePath "$ARCHIVE"             -exportPath src-tauri/gen/apple/build/export             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Localizar .ipa
        id: ipa
        run: |
          IPA="$(find src-tauri/gen/apple -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then echo "Nenhum .ipa gerado"; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Inspecionar ícones dentro do .ipa
        run: |
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "${{ steps.ipa.outputs.path }}" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)"
          echo "App: $APP"
          echo "== Info.plist: chaves de ícone"
          plutil -p "$APP/Info.plist" | grep -i -B1 -A6 "icon" || echo "(nenhuma chave de ícone)"
          echo "== PNGs de ícone soltos no .app"
          ls -la "$APP" | grep -i "icon" || echo "(nenhum)"
          echo "== Assets.car (renditions de ícone)"
          xcrun assetutil --info "$APP/Assets.car" | grep -iE '"Name"|"PixelWidth"|"AssetType"' | grep -i -A2 "appicon" | head -60 || true

      - name: Enviar ao TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
