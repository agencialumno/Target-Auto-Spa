# Build iOS assinado e envio ao TestFlight.
#
# SECRETS (GitHub: Settings > Secrets and variables > Actions > New repository secret)
#
#  IOS_CERTIFICATE_BASE64        Certificado "Apple Distribution" (.p12) em base64.
#       Keychain Access > Meus Certificados > clique com o direito no certificado
#       "Apple Distribution: ..." > Exportar > formato .p12 > defina uma senha.
#       Converta:  base64 -i certificado.p12 | pbcopy        (Mac)
#                  [Convert]::ToBase64String([IO.File]::ReadAllBytes("certificado.p12")) | Set-Clipboard   (Windows)
#  IOS_CERTIFICATE_PASSWORD      A senha definida ao exportar o .p12.
#  IOS_PROVISION_PROFILE_BASE64  Perfil "App Store" (.mobileprovision) em base64.
#       developer.apple.com > Certificates, IDs & Profiles > Profiles > "+" > App Store Connect
#       > App ID br.com.lumno.targetautospa > escolha o certificado Distribution
#       > nome "Target Auto Spa App Store" > baixe e converta para base64 como acima.
#  APP_STORE_CONNECT_KEY_ID      Key ID da API Key (ex.: 38FKF4N94J).
#  APP_STORE_CONNECT_ISSUER_ID   Issuer ID (UUID).
#  APP_STORE_CONNECT_KEY_BASE64  Arquivo AuthKey_<KEYID>.p8 em base64.
#       appstoreconnect.apple.com > Users and Access > Integrations > App Store Connect API
#       > Team Keys. O Issuer ID aparece no topo; o .p8 só pode ser baixado UMA vez.
#       Papel recomendado da chave: App Manager.
#
# Team ID (KH97Q8M556) já está em src-tauri/tauri.conf.json.

name: iOS Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar Rust e targets iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: |
          npm ci
          brew install xcodegen

      - name: Definir número do build
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.iOS=c.bundle.iOS||{};c.bundle.iOS.bundleVersion=String(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Gerar projeto iOS
        run: npm run tauri ios init -- --ci

      # O Tauri gera o projeto Xcode com assinatura automática. Aqui instalamos o certificado e o
      # perfil e depois forçamos assinatura manual no projeto (o que o Codemagic fazia com
      # `xcode-project use-profiles`).
      - name: Verificar ícone 1024x1024
        run: |
          # Sem o PNG de 1024x1024 o App Store Connect mostra um ícone genérico
          SET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          if [ ! -d "$SET" ]; then
            echo "::error::$SET não existe. O tauri ios init não gerou o AppIcon."
            exit 1
          fi
          ENCONTROU=0
          for f in "$SET"/*.png; do
            [ -e "$f" ] || continue
            L="$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')"
            A="$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')"
            if [ "$L" = "1024" ] && [ "$A" = "1024" ]; then ENCONTROU=1; fi
          done
          if [ "$ENCONTROU" != "1" ]; then
            echo "::error::Nenhum PNG 1024x1024 em $SET."
            exit 1
          fi

      - name: Instalar certificado e perfil
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/perfil.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/perfil.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Perfil instalado: $PROFILE_NAME ($PROFILE_UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Configurar assinatura manual no projeto Xcode
        run: |
          pip3 install --break-system-packages codemagic-cli-tools || pip3 install codemagic-cli-tools
          cd src-tauri/gen/apple
          xcode-project use-profiles

      - name: Build do app iOS
        run: |
          # O Tauri compila e cria o archive. A exportação dele pode falhar; seguimos se o archive existir
          npm run tauri ios build -- --export-method app-store-connect || true
          ARCHIVE="$(find src-tauri/gen/apple -name '*.xcarchive' | head -1)"
          echo "Archive encontrado: $ARCHIVE"
          if [ -z "$ARCHIVE" ]; then echo "Nenhum archive foi gerado"; exit 1; fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Exportar .ipa
        run: |
          if find src-tauri/gen/apple -name '*.ipa' | grep -q .; then
            echo ".ipa já exportado pelo Tauri"
            exit 0
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>KH97Q8M556</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.lumno.targetautospa</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive             -archivePath "$ARCHIVE"             -exportPath src-tauri/gen/apple/build/export             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Localizar .ipa
        id: ipa
        run: |
          IPA="$(find src-tauri/gen/apple -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then echo "Nenhum .ipa gerado"; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Enviar ao TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.path }}
