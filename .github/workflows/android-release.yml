# Build Android assinado (.aab) como artifact do GitHub Actions.
#
# SECRETS (GitHub: Settings > Secrets and variables > Actions)
#  ANDROID_KEYSTORE_BASE64    Keystore (.jks) em base64.
#       keytool -genkeypair -v -keystore target-release.jks -alias target \
#         -keyalg RSA -keysize 2048 -validity 10000
#       base64 -w0 target-release.jks     (Linux/Git Bash)
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes("target-release.jks")) | Set-Clipboard   (PowerShell)
#  ANDROID_KEYSTORE_PASSWORD  Senha do keystore informada no keytool.
#  ANDROID_KEY_ALIAS          Alias usado no keytool (ex.: target).
#  ANDROID_KEY_PASSWORD       Senha da chave (a mesma do keystore, se você deu Enter).
#
# GUARDE o .jks e as senhas fora do repositório: perdê-los impede atualizar o app na Play Store.

name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.js'
      - '.github/workflows/android-release.yml'
      - '.github/scripts/assinar-android.py'
  workflow_dispatch:

# Permissões mínimas do GITHUB_TOKEN: o job só lê o código
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). Usamos o sdkmanager dele
      # direto em vez da action setup-android, que tenta instalar o pacote legado "tools".
      - name: Aceitar licenças do Android SDK
        run: |
          # Sem pipefail: o `yes` recebe SIGPIPE quando o sdkmanager termina, e isso não é erro
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Instalar plataforma e NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Instalar Rust e targets Android
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Gerar projeto Android
        run: npm run tauri android init -- --ci

      # Regras do R8/ProGuard exigidas pelo plugin do Google Sign-In (builds de release minificados)
      - name: Regras ProGuard do Google Sign-In
        run: |
          cat >> src-tauri/gen/android/app/proguard-rules.pro <<'PRO'

          # Google Sign-In (tauri-plugin-google-auth)
          -keep class com.google.android.gms.auth.** { *; }
          -keep class com.google.android.gms.common.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          PRO

      - name: Configurar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          python3 .github/scripts/assinar-android.py

      # Um único build gera os dois: o .aab e o .apk saem do mesmo Gradle, com o mesmo applicationId,
      # a mesma versão e a mesma assinatura (signingConfig "release", injetado por assinar-android.py)
      - name: Build .aab e .apk
        run: npm run tauri android build -- --aab --apk

      # Confere que o .apk está assinado com um certificado válido (não imprime o certificado nem segredos)
      - name: Verificar assinatura do .apk
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$APK" || { echo '::error::.apk não gerado'; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -E "^package:" | sed -E "s/ platformBuildVersion.*//"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 3

      # .apk assinado, só para instalar direto no aparelho (sem Play Store). Artifact separado do .aab.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 3
          if-no-files-found: error

      # Não deixa o keystore nem as senhas no disco do runner depois do build
      - name: Limpar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties
